---
- name: Disable swap (required for kubelet)
  command: swapoff -a
  changed_when: false

- name: Persist swap disabled
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load kernel modules required by Kubernetes
  modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]

- name: Set required sysctl params
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: yes
  loop:
    - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { name: net.ipv4.ip_forward,                value: "1" }