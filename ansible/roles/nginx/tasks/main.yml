---
- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Deploy reverse-proxy config
  template:
    src: app.conf.j2
    dest: /etc/nginx/sites-available/app.conf
  notify: Reload nginx

- name: Enable site
  file:
    src: /etc/nginx/sites-available/app.conf
    dest: /etc/nginx/sites-enabled/app.conf
    state: link
  notify: Reload nginx

- name: Ensure nginx running
  service:
    name: nginx
    state: started
    enabled: true